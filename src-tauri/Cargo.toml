[package]
name = "hsr-warp-roll"
version = "1.0.1"
description = "星穹铁道跃迁点名器（中文修改版，完全离线）"
authors = ["richkobe"]
license = "MIT"
repository = "https://github.com/yibanm/HSR-Warp-Simulator-richkobe"
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
